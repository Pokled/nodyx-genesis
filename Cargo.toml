[workspace]
resolver = "2"
members = [
    "crates/genesis-core",
    "crates/genesis-view",
    "crates/genesis-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"

# La performance n'est pas le sujet en 0.0.1. On optimise la lisibilite.
[profile.dev]
opt-level = 1
