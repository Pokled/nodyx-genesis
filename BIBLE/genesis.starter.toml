# Nodyx Genesis, configuration de départ (tranchée 12)
# Toutes ces valeurs sont des points de départ, à mesurer et ajuster.
# Le principe est de partir avec des nombres, pas avec "configurable".
# Périmètre : Genesis 0.0.1.

[world]
grid_width  = 192
grid_height = 192
bounded     = true          # des bords, pas de repli toroïdal

[planet]
# Constantes physiques du monde, fixées à la création, constantes sur toute sa vie (pas de
# météo). Depuis 2026-09-02 elles agissent vraiment : la température sur le métabolisme, la
# gravité sur le déplacement. Un monde loin de son optimum, ou lourd, est plus dur à habiter.
# A/B graine 1, 50k ticks : à 2 °C (13 sous l'optimum) la diversité génétique chute de 34 %
# (0,099 -> 0,065), morts de faim +8 %. A 35 °C, morts de faim +24 %, morts d'âge -27 % (on
# meurt de faim avant de vieillir), 20 générations au lieu de 17, vitesse moyenne +36 %. A
# 1,6 g, morts de faim +10 %, efficacité poussée vers le haut. Le défaut (15 °C = optimum,
# 1 g) est inerte : aucune régression.
temperature_c   = 15.0      # température moyenne de l'environnement, degrés Celsius
temp_optimal_c  = 15.0      # température où le métabolisme est le moins cher
temp_metab_slope = 0.012    # surcoût métabolique par degré d'écart à l'optimum (0 = inerte)
heat_tol_span_c = 16.0      # amplitude thermique du génome : l'optimum d'un corps va de
                            # temp_optimal_c - span/2 (heat_tol=0, froid) à + span/2 (chaud) ;
                            # 0 = trait heat_tol inerte (A/B)
medium          = "eau"     # milieu où baigne la vie : eau, acide, air, ...
gravity         = 1.0       # en multiples de la gravité terrestre ; multiplie le coût du déplacement
pressure_atm    = 1.0       # en atmosphères ; affichée, sans effet mécanisé pour l'instant

[season]
# Les saisons (2026-09-03, experiments/011). Le milieu n'est plus figé : la capacité
# nourricière de chaque case (plafond ET vitesse de régén) oscille lentement autour de sa base,
# une sinusoïde pure du tick (donc déterministe, et qui reprend juste après un rechargement).
# Saison grasse, la population déborde ; saison maigre, une famine synchrone la rabote (~35 %)
# et rebrasse les lignées. Pour que ça morde, la capacité de la matière est un plafond lointain
# (voir [bricks]). A/B graine 1 : population 5300 <-> 9600 au fil de l'année (contre une ligne
# plate sans saisons), deux basculements de génome au lieu d'un. amplitude = 0 : aucun effet,
# byte-identique à un monde sans saisons.
# La saison a aussi une composante THERMIQUE (schema v18) : la température effective oscille de
# +/- temp_amplitude_c degrés, DÉCALÉE d'un quart de cycle sur la saison nourricière (le plus
# froid n'est pas le plus maigre). La population affronte deux stress par an au lieu d'un ;
# couplé au trait heat_tol, ça lève la diversité génétique d'environ 44 % (A/B graine 1,
# 130k ticks : 0,085 -> 0,122). 8 °C tuait trop de graines marginales, on tient 5.
amplitude       = 0.5       # oscillation de la capacité nourricière, fraction de la base (0,5x à 1,5x)
temp_amplitude_c = 5.0      # amplitude thermique de la saison, degrés Celsius (0 = pas de saison thermique)
period_years    = 1.6       # durée d'un cycle complet (une abondance + une disette), en années-monde
regen_floor     = 0.15      # même au creux, le plafond ne descend pas sous cette fraction de la base

[time]
tick_duration_seconds        = 3600   # 1 tick = 1 heure-monde en 0.0.1
target_ticks_per_real_second = 60     # la sim vise environ 60 fois le temps réel

[resources]
regen_rate   = 0.015  # fraction du plafond de la case régénérée, par passage de régen
max_per_cell = 10.0   # plafond d'une case parfaitement fertile
initial_fill = 0.5    # remplissage initial, en fraction du plafond propre à chaque case
regen_every  = 4      # la régénération ne tourne qu'un tick sur N (taux multiplié par N),
                      # le milieu change lentement : on évite de balayer 16 000 cases chaque tick

# Le plafond réel d'une case = max_per_cell * fertilité(case). La fertilité est un champ
# statique généré à la création (quelques bosses douces sur fond pauvre), voir world.rs.

[bricks]
# Briques élémentaires (0.0.2) : la matière structurelle dont sont faits les corps. Le monde
# en contient une quantité finie (matter_per_cell x nombre de cases). Un corps vivant en
# immobilise body_matter ; le reste est le stock libre. Une division prend body_matter du
# stock pour bâtir l'enfant ; si le stock est à sec, la division cale et le parent patiente.
# La mort rend body_matter au stock. Somme conservée exactement.
# Plafond dur de capacité. Depuis les saisons (2026-09-03) il est réglé haut exprès : la
# capacité de la matière (~9600 sur 192x192) est un plafond lointain que seuls les pics de
# saison grasse approchent, et c'est la nourriture qui tient la population au quotidien. Sans
# ça, la matière tenait la ligne et les saisons ne se voyaient pas. Distinct de l'énergie (le
# carburant) et de la surexploitation (la fatigue du sol). Non spatial : la géographie de la
# matière viendra avec les biomes.
matter_per_cell = 0.26   # matière totale du monde = ceci x nombre de cases (192x192 -> ~9600)
body_matter     = 1.0    # matière immobilisée par un corps vivant, libérée à la mort
comfort_frac    = 0.06   # V2 : sous ce coussin (fraction de la matière totale), la division
                         # devient probabiliste. La population respire dans cette bande au
                         # lieu d'être épinglée au plafond.
retry_frac      = 0.4    # patience après un échec faute de matière (fraction de la gestation ;
                         # deux fois moins sur un échec probabiliste, la matière se libère vite)

[environment]
corpse_nutrients     = 1.5    # matière rendue à la case à la mort (le corps)
corpse_energy_return = 0.5    # + cette fraction de l'énergie restante de l'entité
strain_per_harvest   = 0.06   # tension de surexploitation ajoutée par unité récoltée
strain_decay         = 0.997  # décroissance de la tension par tick (récupération du sol)

[metabolism]
base_burn = 0.05   # énergie/tick pour metabolism = 0.5
move_cost = 0.02   # énergie par unité de distance
eat_rate  = 2.0    # énergie max absorbée d'une case par tick

[biology]
# Biologie de fond (0.0.3, tranche 8). Un scalaire Entity.health dans [0, 1] consolide la
# condition biologique : il intègre lentement les famines répétées et la vieillesse. Un
# corps usé se déplace moins vite et meurt plus tôt de vieillesse. La cognition (la
# biographie) lit ce scalaire, pas le détail. A/B graine 1, 60000 ticks, contre santé inerte
# (frail_slow = 1.0, wear_death_boost = 0.0) : morts par famine +15 % (2 291 -> ... la
# fragilité ralentit un corps déjà en peine, ça se cumule), morts par âge +2 %, génération
# moyenne +0,5, diversité -0,007. Effet réel et mesuré, pas réglé pour l'image (T-16).
wear_start        = 0.6     # sous 0,6x l'espérance de vie, corps à pleine santé
wear_floor        = 0.15    # santé cible à 1,5x l'espérance de vie
heal_rate         = 0.015   # correction de l'écart à la cible par tick, rassasié
damage_rate       = 0.02    # ... en famine (cible 0), plus rapide : la faim laisse une marque
frail_slow        = 0.5     # max_step *= frail_slow + (1 - frail_slow) * health ; 1.0 = inerte
wear_death_boost  = 1.5     # p_death_age *= 1 + wear_death_boost * (1 - health) ; 0 = inerte

[lifecycle]
starve_at           = 0.0
lifespan_ticks_mean = 20000   # environ 2,3 années-monde, à régler
age_death_curve     = 4.0

[reproduction]
mode                 = "asexual"  # stade molécule : scission. Le sexué arrive à 0.0.2+
energy_threshold     = 8.0        # énergie minimale pour se scinder
energy_cost          = 1.5        # surcoût de réplication, retiré avant le partage en deux
partner_radius       = 2.0        # inutilisé en 0.0.1, gardé pour 0.0.2
mutation_rate        = 0.05       # par trait
mutation_scale       = 0.1        # écart-type de la mutation gaussienne
lethal_mutation_rate = 0.06       # chance qu'une mutation soit létale : pas d'enfant
gestation_ticks_base = 700        # après division, cooldown = base * (1.5 - fertilité)
birth_loss_base      = 0.30       # échec de division sans infrastructure, avant surpopulation
crowding_half        = 1.8        # entités en surplus sur une case pour un échec quasi certain
maturity_frac        = 0.05       # fraction de l'espérance de vie avant la 1re division
                                  # (un juvénile ne se reproduit pas ; casse la croissance exponentielle)

[cohesion]
# Le trait `cohesion` du génome. La FORCE de mouvement (pull_max) est éteinte : elle
# déstabilise l'écosystème (voir expérience 003). L'agrégation reste passive : les entités
# convergent sur la nourriture, ça fait des amas de fait.
# Ce que fait `cohesion` en V1 : la retenue sur les communs. Une entité cohésion haute,
# entourée de parents, mange un peu moins (coût privé) et fatigue beaucoup moins la case
# partagée (bien commun). Sélection par parentèle : la coopération monte là où il y a des
# colonies de parents, redescend chez les solitaires.
radius               = 4.0
pull_max             = 0.0    # force de mouvement, éteinte
similarity_scale     = 2.0    # distance L1 de génome au delà de laquelle "pas parent"
support_cap          = 4.0
support_birth_relief = 0.0
hunger_damp          = 0.0
eat_restraint        = 0.25   # intake en moins pour un coopérateur entouré de parents
strain_restraint     = 0.7    # surexploitation en moins dans la même situation

[cells]
# Cellules (0.0.2, tranche 2, étape 1 « membrane »). Un amas d'entités proches,
# génétiquement parentes, cohésives et persistant devient une cellule : une unité reconnue.
# Les membres restent simulés un à un (l'étape 2 les dé-simulera). Être en cellule apporte
# le partage d'énergie (chaque membre tend vers la moyenne du groupe, un tampon contre la
# famine locale) et une reproduction protégée. C'est ce qui rend le trait `cohesion`
# vraiment adaptatif. Bascule réversible : une cellule qui se disperse ou perd ses membres
# se dissout (tranchée 7). Détecteur bâti sur le modèle de l'émergence d'espèce.
check_every       = 200    # détection tous les N ticks ; l'entretien tourne chaque tick
link_dist         = 2.0    # deux entités se lient si à moins de N cases l'une de l'autre
kin_dist          = 0.7    # ... et si leur distance L1 de génome est sous ce seuil
min_cohesion      = 0.45   # cohésion moyenne minimale du groupe pour former une cellule
min_members       = 12     # taille minimale d'un amas pour former une cellule
max_spread        = 6.0    # rayon moyen maximal des membres pour former une cellule
dissolve_members  = 6      # V2, hystérésis : une cellule formée ne se dissout qu'en dessous de ça
dissolve_spread   = 11.0   # V2, hystérésis : ... et seulement au delà de ce rayon
grace_ticks       = 600    # V2 : une cellule fraîche ne se dissout pas avant cet âge (sauf 0 membre)
persist_checks    = 4      # contrôles consécutifs où le candidat doit tenir avant de former
leave_factor      = 1.9    # un membre à plus de rayon * ce facteur du centre quitte la cellule
energy_share      = 0.15   # fraction de l'écart à la moyenne d'énergie de la cellule corrigée par tick
cell_birth_relief = 0.4    # part d'échec de division en moins pour un membre de cellule
# Membrane (0.0.2, tranche 2b) : un membre de cellule EN DANGER de famine brûle moins d'énergie
# de base (métabolisme mutualisé). Le repli est proportionnel à l'enfoncement dans la zone de
# péril : nul pour un membre bien nourri (l'équilibre des temps gras, où vit la diversité, ne
# bouge pas), plein pour un membre qui frôle la mort. C'est l'avantage de survie du
# pluricellulaire, le tampon anti-disette. cell_burn_relief = 0 coupe (A/B).
cell_burn_relief  = 0.5    # fraction de la dépense de base en moins pour un membre en péril (× gravité)
# Fusion (schéma v15) : deux cellules stables dont les membranes se chevauchent et dont les
# génomes moyens se ressemblent n'en font plus qu'une. La plus grosse garde son identité et
# son histoire, la petite y disparaît. Émergent : aucune règle ne la déclenche, c'est une
# condition géométrique et génétique que le monde franchit quand deux cellules parentes
# dérivent l'une dans l'autre. A/B graine 1, 60k ticks, contre `fuse = false` : dissolutions
# de cellule -36 % (les petites cellules en peine fusionnent au lieu de mourir), diversité
# génétique finale -12 % (0,059 -> 0,052 ; la fusion consolide), famine +11 %, naissances
# +5 %. La cellule devient un niveau d'organisation qui s'agrège.
fuse         = true
fuse_overlap = 0.5     # chevauchement exigé : distance(centres) < (r1 + r2) * ce facteur
fuse_kin     = 0.9     # ... et distance L1 des génomes moyens des deux cellules sous ce seuil
# Division (schéma v19) : une cellule grande, mûre et étirée se pince en deux. C'est la
# reproduction cellulaire : la cellule devient une unité qui naît (agrégat), grandit,
# fusionne, se divise ou meurt, et la sélection agit à son niveau. Émergent : rien ne la
# déclenche, c'est la forme étirée (la chimiotaxie tire la membrane vers deux zones riches)
# qui la provoque. A/B graine 1, 120k ticks, contre divide = false : 156 divisions, cellules
# vivantes 28 -> 54, part de la population en cellule 13 % -> 22 %, diversité génétique de
# plateau quasi inchangée (0,100 -> 0,106). Des seuils plus bas (division fréquente) écrasent
# la diversité : les cellules à succès copient leur génome. divide = false coupe (A/B).
divide            = true
divide_members    = 42    # effectif minimal pour se diviser (bien au-dessus de min_members)
divide_elongation = 1.9   # allongement minimal (étalement axe long / axe court)
divide_age_ticks  = 4000  # âge minimal avant la première division
# Répulsion : deux cellules qui se chevauchent mais dont les génomes sont trop distants pour
# fusionner se repoussent doucement (leurs membres glissent à l'opposé de l'autre centre). La
# membrane devient une frontière : des cellules non parentes se côtoient au lieu de se
# traverser. repel = false coupe (A/B).
repel             = true
repel_strength    = 0.06  # fraction du chevauchement corrigée par tick, par membre (bornée)
# Tissus (0.0.2, vers la marche organisme). Des cellules de génome proche (trait_l1 <=
# tissue_kin) dont les membranes se touchent (distance < (r1+r2) * tissue_reach) sans fusionner
# adhèrent : elles forment un tissu (composante connexe, >= tissue_min cellules). Dérivé chaque
# tick, pas d'état sérialisé (Cell.tissue porte l'id). tissue = false coupe (A/B).
tissue            = false
tissue_reach      = 1.15  # facteur de portée de l'adhésion (membranes qui se touchent)
tissue_kin        = 0.5   # distance L1 max des génomes moyens (plus stricte que fuse_kin)
tissue_min        = 3     # nombre minimal de cellules pour un tissu
tissue_pull       = 0.04  # traction d'adhésion : rapproche les cellules d'un tissu jusqu'au contact (fait émerger le pavage)
# Adhésion persistante (0.0.2, vers l'organe). tissue_bond = true : la connexité d'un tissu vient
# de LIENS de paire gardés dans le temps (world.cell_bonds), pas d'un test de distance refait de
# zéro chaque tick. Un lien se noue au contact entre cellules parentes et ne casse qu'au-delà d'un
# étirement franc (bond_break) ou d'une dérive génétique forte ; entre les deux un ressort
# (bond_stiffness) ramène les deux cellules. Une cellule tissée par plusieurs liens résiste à la
# division (elle est somatique). Un tissu tient alors une perturbation (prédation d'une cellule de
# bord, division d'un membre) au lieu de se défaire et de voir ses cellules "redevenir" isolées.
# tissue_bond = false : dérivation tick à tick, comportement d'origine (A/B).
tissue_bond       = false
bond_form         = 1.15  # distance (x (r1+r2)) en deçà de laquelle un lien se noue
bond_break        = 2.4   # distance (x (r1+r2)) au-delà de laquelle un lien casse (hystérésis : > bond_form)
bond_stiffness    = 0.12  # raideur du ressort de lien (rappel vers le contact, plus ferme que tissue_pull)
divide_bond_resist = 0.15 # le seuil d'allongement pour se diviser monte de ceci par lien (cellule tissée = somatique)
# Gène d'adhésion (0.0.2, piste D étape 1, premier gène d'un génome STRUCTUREL séparé du génome
# de traits). Sans lui, tissue_kin est un seuil de parenté fixe pour tout le monde ; avec lui,
# chaque paire de cellules adhère selon SA tolérance héritée (mutée à chaque division comme les
# traits). Marche mécaniquement (change réellement la formation de tissu, vérifié), mais la
# sélection sur le gène lui-même reste trop diluée pour être fiable : la formation de cellule
# est gouvernée par la parenté de TRAITS, sans rapport avec ce gène, donc la variance utile
# s'effondre au niveau cellule (voir experiments/018). Gardé éteint par défaut.
adhesion_gene     = false
adhesion_mult_min = 0.4   # multiplicateur du seuil pour la paire au gène le plus timide
adhesion_mult_max = 2.0   # multiplicateur du seuil pour la paire au gène le plus permissif
# Abri du tissu (0.0.2, vers les rôles). Une cellule entourée (tissue_bonds >= shelter_bonds
# voisines du même tissu) est à l'intérieur de la nappe : un prédateur ne peut pas l'atteindre,
# et une part shelter_feed du surplus des cellules de bord coule vers elle. Le cœur, protégé et
# nourri, accumule ses membres et se divise ; le bord encaisse. La division germinal/somatique
# émerge de la seule géométrie. tissue_shelter = false coupe (A/B).
tissue_shelter    = false
shelter_bonds     = 4     # nb de voisines du même tissu à partir duquel une cellule est "intérieure"
shelter_feed      = 0.12  # fraction du surplus des cellules de bord reversée au cœur (0 = abri sans nourrissage)
# Gène de rôle (0.0.2, piste D étape 2, second gène du génome structurel). Contrairement au gène
# d'adhésion (moyenné par cellule, dilué, experiments/018), chaque ENTITÉ porte son propre seuil
# hérité (germinal_bias) comparé à l'entassement de sa cellule : variance intra-cellule réelle
# (vérifiée), vraie prise pour la sélection individuelle. role_gene ne fait qu'exister/muter le
# gène ; deux conséquences indépendantes en tirent parti ci-dessous.
role_gene         = false
role_bonds_scale  = 6.0   # échelle de tissue_bonds (0..~6) à laquelle le seuil personnel se compare
# Conséquence DURE (experiments/019) : une entité en cellule ne peut se reproduire que si elle
# est germinale selon son propre seuil. Coût écologique net et constant (ratio final 0,61-0,94
# selon la graine, creux profond en cours de route) — couper le droit de se reproduire punit
# fort tant que le tissu est encore jeune. Aucune extinction observée, mais pas gratuit.
role_reproduction_gate = false
# Conséquence DOUCE (experiments/020) : jamais de blocage, une entité somatique reverse une part
# role_share_frac de son surplus aux entités germinales de sa même cellule (flux conservé, sans
# RNG). Coût plus modéré (suppression 0,20-0,73 selon la graine/le tick, jamais d'extinction)
# mais toujours pas gratuit — près d'un seuil dur de reproduction, rediriger de l'énergie semble
# structurellement à perte. Ni l'une ni l'autre conséquence n'a montré de dérive de sélection
# fiable sur germinal_bias : chapitre clos pour l'instant (voir 009_organism.md).
role_share        = false
role_share_frac   = 0.12  # fraction du surplus d'une entité somatique reversée aux germinales de sa cellule
# Épithélium qui compte (0.0.2, vers l'organe). epithelium_shield = true : une nappe ORDONNÉE
# (psi6 moyen du tissu >= shield_order) et assez grande (>= shield_cells cellules) fait REMPART :
# TOUTES ses cellules sont hors d'atteinte d'un prédateur, pas seulement le cœur. Purement passif
# (aucune énergie ne bouge, aucune activité ajoutée -> l'ordre ne fond pas). Une lignée à l'abri
# derrière son épithélium survit mieux : la sélection récompense l'ancrage, ce qui compense le
# coût de tissue_bond. Aucun if kind == epithelium. epithelium_shield = false coupe (A/B).
epithelium_shield = false
shield_order      = 0.42  # psi6 moyen du tissu au-delà duquel la nappe fait rempart
shield_cells      = 5     # nombre minimal de cellules pour qu'une nappe fasse rempart
# Contraction musculaire (0.0.2, vers la locomotion). Une cellule d'un tissu dont les membres
# forment un nuage nettement étiré (elongation >= muscle_elong) exerce une force axiale
# OSCILLANTE : elle se resserre et se relâche, déphasée le long d'une onde qui traverse le tissu,
# et pousse un peu les entités libres proches. Aucune règle ne nomme un muscle : c'est une
# condition sur l'allongement et l'appartenance à un tissu. muscle_contract = false coupe (A/B).
muscle_contract   = false
muscle_elong      = 1.8   # allongement moyen du nuage de membres au-delà duquel une cellule devient contractile
muscle_strength   = 0.18  # amplitude du déplacement axial par membre au pic de contraction (bornée)
muscle_period_ticks = 500 # période du cycle contraction / relâchement
# Locomotion dirigée (0.0.2, vers l'organe). muscle_seek_food = true : l'axe de l'onde
# péristaltique suit le gradient de ressources local (même chimiotaxie que forage_target, déjà
# utilisée par chaque entité) au lieu d'un axe arbitraire ; sans rien de mieux à portée
# (muscle_sense_radius), retombe sur l'axe d'origine. Pendant la phase active de contraction,
# une cellule qui a vraiment senti une cible tire tout son nuage d'un cran vers elle (une
# extension de pseudopode, bornée) : reformer sa silhouette sur son propre centre est
# symétrique, ça ne déplace nulle part. muscle_seek_food = false coupe (A/B).
muscle_seek_food  = false
muscle_sense_radius = 3.0 # portée de la chimiotaxie de tissu (x le rayon de la cellule)

[predation]
# Prédation (0.0.2, experiments/012_predation.md). Une entité qui a faim (energy < hunt_below)
# et qui a à portée une entité nettement plus faible (proie.energy < self.energy * prey_frac)
# la mange : la proie meurt (DeathCause::Predation), une part transfer de son énergie passe au
# prédateur. Aucune règle ne nomme un prédateur, c'est une condition d'énergie et de distance.
# enabled = false par défaut : c'est une expérience, elle ne change les mondes que si on
# l'allume (bouton d'A/B).
enabled           = false
reach             = 2.0   # portée de l'attaque, en cases du monde
hunt_below        = 4.0   # le prédateur ne chasse que sous ce niveau d'énergie (seuil de repro = 8)
prey_frac         = 0.5   # la proie doit valoir moins que cette fraction de l'énergie du prédateur
transfer          = 0.55  # part de l'énergie de la proie qui passe au prédateur

[organism]
# Organisme (0.0.2, vers les organes). Une composante connexe de cellules dont les membranes
# se touchent, SANS exiger qu'elles soient parentes : c'est ce qui permet à plusieurs types de
# tissus de tenir dans une même unité. On lui donne une identité STABLE (elle survit aux
# changements de composition) : reconnue après persist_checks contrôles tenus, gardée tant
# qu'un noyau persiste, un nom frappé à la naissance. Aucune règle ne nomme un organisme.
# enabled = false par défaut (bouton d'A/B).
enabled           = false
reach             = 1.4   # facteur de portée du contact entre cellules (x (r1 + r2))
min_cells         = 3     # nombre minimal de cellules pour un organisme
persist_checks    = 2     # contrôles tenus avant reconnaissance, et tolérance avant dissolution
check_every       = 200   # période de détection, en ticks
pool_share        = 0.15  # à chaque contrôle, chaque membre est ramené de cette fraction vers l'énergie moyenne de l'organisme (il a faim / est repu EN ENTIER). 0 = identité sans destin partagé (A/B)
# Réserve adipeuse (0.0.2, essai inerte au régime de w6 : pool_share efface déjà l'écart dont
# elle a besoin pour se déclencher — voir experiments/016). Gardée éteinte par défaut.
adipeux_share     = 0.0   # part du surplus des membres ronds et gorgés versée aux membres en danger (0 = coupé)
adipeux_rich_frac = 0.75  # fraction du plafond d'énergie à partir de laquelle un membre rond compte "gorgé"

[cognition]
# Cognition (0.0.3, tranche 1 « le premier souvenir »). Une entité qui perçoit assez bien
# (perception_min), a vécu assez longtemps (age_min_frac) et vient de subir un choc s'éveille
# en agent : elle gagne une mémoire épisodique spatiale, bornée et décroissante, qui biaise
# son déplacement (elle évite les lieux de péril, revient aux lieux d'aubaine). Réversible :
# un agent sans souvenir depuis lapse_ticks retombe entité de fond. Substrat semé : pas de
# personnalité héritée ni de besoins pour l'instant (voir 05_COGNITION.md).
perception_min    = 0.62   # perception minimale pour l'éveil (plage de départ : 0.35..0.65)
age_min_frac      = 0.15   # fraction de l'espérance de vie à avoir vécu avant l'éveil
peril_frac        = 0.18   # énergie sous peril_frac * energy_threshold : choc de péril
bounty_abs        = 3.0    # gain d'énergie en un tick au-dessus de ça : choc d'aubaine
shock_interval    = 150    # intervalle mini entre deux chocs enregistrés pour une entité
grace_ticks       = 800    # un agent frais ne peut pas retomber avant cet âge
lapse_ticks       = 2500   # un agent sans aucun souvenir depuis ce délai retombe
memory_decay      = 0.9985 # facteur de décroissance de la force d'un souvenir, par tick
memory_eps        = 0.05   # un souvenir sous cette force est oublié
max_memories      = 12     # nombre maximal de souvenirs (le plus faible cède la place)
memory_merge_dist = 3.0    # deux souvenirs de même nature à moins de N cases fusionnent
mem_weight        = 0.5    # poids maximal du biais mémoire dans la cible de déplacement
mem_radius        = 7.0    # portée spatiale du noyau de souvenir, en cases
witness_radius    = 4.0    # (tranche 3) un agent à moins de N cases d'une mort la voit, souvenir ancré ; 0 désactive
witness_kin_only  = true   # ne retenir que la mort d'un membre de sa propre lignée fondatrice
# Besoins (tranche 4) : jauges internes faim / peur / solitude qui pondèrent le comportement.
hunger_relief     = 0.996  # relâchement de la faim par tick (suit vite la baisse d'énergie, redescend lentement)
fear_relief       = 0.99   # relâchement de la peur par tick
fear_radius       = 6.0    # portée du noyau de menace autour d'un souvenir aversif (cases)
fear_shock_window = 200    # un choc de péril de moins de N ticks maintient la peur au maximum
fear_gain         = 1.2    # de combien la peur amplifie l'évitement des souvenirs aversifs
social_pull       = 0.3    # poids maxi du glissement vers le centre des siens quand l'agent est isolé
needs_weight      = 1.0    # bouton maître des besoins ; 0 = comportement de la tranche 3
heritable_personality = true  # (tranche 5) prudence/curiosité = traits du génome hérités ; false = dérivées de longévité/perception
# Souvenirs sociaux (tranche 7) : un agent reconnaît les autres agents qu'il croise souvent.
social_radius     = 4.0    # deux agents à moins de N cases renforcent leur relation
social_check_every = 8     # contrôle de proximité (coûteux : une requête spatiale/agent) tous les N ticks
social_fam_gain   = 0.08   # gain de familiarité par contrôle où l'autre est proche
social_decay      = 0.985  # relâchement de la familiarité par contrôle
social_eps        = 0.03   # une relation sous cette familiarité est oubliée
friend_pull     = 0.5      # part du glissement de solitude qui vise l'ami plutôt que le centre des siens ; 0 = tranche 6

[voice]
# La Voix (jalon 0.0.4, tranche 1). Un agent qui subit le choc d'une famine émet une alarme
# à sa position ; les agents proches ont un sursaut de peur, sans former de souvenir (la peur
# redescend ensuite via fear_relief). Aucun lexique : premier étage vers le langage émergent.
# A/B graine 1, 60000 ticks, contre alarm_fear = 0 : morts par famine -10 % (4 966 -> 4 475),
# diversité génétique +37 % (0,043 -> 0,059), naissances -5 %. La panique disperse et sert
# d'alerte précoce : un cri, et les voisins quittent une zone qui tue. Effet réel et mesuré.
signal_radius = 5.0    # portée de perception d'une alarme, en cases
signal_ttl    = 4      # durée de vie d'un signal, en ticks
alarm_fear    = 0.5    # plancher de peur imposé à qui entend ; 0 = alarmes émises mais sans effet (A/B)
max_signals   = 128    # signaux vivants au plus ; en famine générale on garde les plus récents

# Tranche 2 : l'appel. Un agent rassasié qui mange bien sur une case franchement riche lance
# un appel « bon coin ici » ; les agents proches en train de décider où aller infléchissent
# leur cible vers lui, d'autant plus qu'ils ont faim. Deux genres fixes (alarme, appel).
# A/B graine 1, 60000 ticks, contre bounty_call = false : naissances +4 % (9 582 -> 9 966),
# diversité génétique +46 % (0,052 -> 0,076), morts par famine +8 %. L'appel concentre la
# population sur les bons coins, ce qui brasse davantage les lignées et coûte quelques trajets.
bounty_call      = true  # false = aucun appel émis (A/B)
bounty_pull      = 0.35  # à quel point un appel entendu tire la cible vers lui ; 0 = appel visible mais inerte
bounty_cell_frac = 0.55  # fraction du plafond d'une case au-dessus de laquelle elle est « franchement riche »

# Relais nerveux (0.0.2, vers l'organe). Un tissu qui compte au moins nerve_min_agents membres
# agents (mesure, pas nommé) étend leur portée de perception de signal — comme si le réseau du
# tissu relayait le cri plutôt que chacun le percevant seul. A/B graine 26, 60000 ticks (config
# w6, toute la pile) : population finale +50 %, tissus vivants x1,6, psi6 x2,8 (0,18 -> 0,51),
# agents vivants +41 %, profil de mortalité inchangé — un monde plus grand et plus tissé dans
# son ensemble. Le plus net des essais « que le type compte » à ce jour (experiments/017).
# Retenu, mais jamais à chaud sur un monde qui tourne (même règle que tissue_bond/muscle_seek_food).
nerve_relay       = false  # false = chaque agent perçoit seul, dans signal_radius (A/B)
nerve_min_agents  = 3      # membres agents minimum dans un même tissu pour que le relais s'applique
nerve_radius_mult = 2.5    # multiplicateur de portée de perception pour un agent relayé

[view]
# Niveau de détail de la projection (genesis-view::project). Au delà du seuil, la frame
# envoie des amas au lieu d'individus : le fichier reste petit quelle que soit la population.
detail_max_entities = 500
cluster_grid        = 30    # cluster_grid^2 amas au plus en mode région

[watch]
# Détecteurs mécanisés qui produisent les événements saillants (les chapitres).
# Ils ne mutent que WorldState.watch, jamais les entités ni le milieu.
interval_ticks         = 200    # un contrôle tous les N ticks
species_min_size       = 25     # effectif minimal d'un groupe pour être candidat espèce
species_min_distance   = 0.9    # distance L1 sur les 7 traits, groupe vs stock dominant
species_persist_checks = 3      # contrôles consécutifs où le candidat doit tenir
species_max_spread     = 18.0   # rayon moyen max des membres : au delà, c'est de la dérive dispersée
crash_drop_frac        = 0.5    # fraction de population perdue pour parler d'effondrement
crash_window_checks    = 6      # longueur de la fenêtre de détection d'effondrement
genome_shift_persist_checks = 5 # contrôles consécutifs où une autre clé de génome doit dominer
                                # avant de parler de basculement du génome dominant (0 = coupé)

[persistence]
snapshot_interval_ticks   = 5000
event_log_partition_ticks = 100000
series_every              = 500    # une ligne de série temporelle de stats (series.jsonl) tous les N ticks
journal_keep_ticks        = 120000 # serve : events.jsonl garde ce détail complet ; au-delà, seuls
                                   # les chapitres roulent dans events.chronicle.jsonl. 0 = jamais compacté
                                   # (le matériau du graphe d'évolution génétique, series.html)

[events]
max_events_per_tick = 4096
max_cascade_depth   = 12
