<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodyx Genesis, la bibliotheque des mondes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --abyss: #04060b; --deep: #0b1019;
    --glass: rgba(11,16,26,0.6); --line: rgba(126,158,214,0.16);
    --ink: #e9edf7; --soft: #9aa6be; --muted: #59637a;
    --cyan: #52e6df; --green: #7ef0a6; --rose: #ff8fa0; --violet: #b9a0ff;
    --serif: "Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 15px/1.6 var(--mono);
    background: radial-gradient(130% 90% at 50% 0%, #121826 0%, #070a11 55%, #04060b 100%) fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 76px 28px 120px; }
  header { text-align: center; margin-bottom: 56px; }
  header .kicker {
    font-size: .74rem; letter-spacing: .24em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 16px;
  }
  header h1 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(2.4rem, 6vw, 3.8rem);
    margin: 0; line-height: 1.05;
  }
  header p { color: var(--soft); max-width: 54ch; margin: 20px auto 0; font-family: var(--serif);
    font-size: 1.14rem; line-height: 1.75; text-wrap: balance; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 20px 18px; transition: border-color .18s, transform .18s, background .18s;
  }
  .card:hover { border-color: rgba(82,230,223,.5); transform: translateY(-3px); background: rgba(14,20,32,.82); }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card .nm { font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }
  .card .sd { color: var(--muted); font-size: .74rem; }
  .card .lin { color: var(--cyan); font-size: .82rem; margin-top: 2px; }
  .card .lin.extinct { color: var(--rose); }
  .card svg { width: 100%; height: 46px; display: block; margin: 14px 0 12px; }
  .card .row { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .78rem; color: var(--soft); }
  .card .row b { color: var(--ink); font-weight: 500; }
  .card .go { color: var(--cyan); font-size: .76rem; margin-top: 12px; letter-spacing: .03em; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .foot { color: var(--muted); font-size: .8rem; margin-top: 64px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Nodyx Genesis</div>
    <h1>La bibliotheque des mondes</h1>
    <p>Chaque monde nait d'une graine. Meme graine, meme monde, jusqu'au dernier tick.
    Rien n'y est ecrit d'avance ; on ouvre, on regarde, on lit ce qui s'est passe.</p>
  </header>
  <div class="grid" id="grid"></div>
  <div class="foot">
    Engendre par <span style="font-family:var(--serif)">genesis</span> &middot; une page reconstruite a chaque run.
  </div>
</div>

<script id="d-cards" type="application/json">__CARDS__</script>
<script>
const C = JSON.parse(document.getElementById('d-cards').textContent);
const fr = n => Number(n || 0).toLocaleString('fr');
const grid = document.getElementById('grid');

if (!C.length) {
  grid.outerHTML = '<div class="empty">Aucun monde ici pour l\'instant. Lancez <code>genesis run --seed N --out worlds/wN</code>.</div>';
} else {
  grid.innerHTML = C.map(function (c) {
    const s = c.pop_series || [];
    let spark = '';
    if (s.length > 1) {
      const mx = Math.max(1, Math.max.apply(null, s));
      const W = 260, H = 46;
      let d = '';
      for (let k = 0; k < s.length; k++) {
        const x = (k / (s.length - 1)) * W;
        const y = H - (s[k] / mx) * (H - 3) - 1.5;
        d += (k ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      }
      let a = 'M0,' + H + ' ';
      for (let k = 0; k < s.length; k++) {
        const x = (k / (s.length - 1)) * W;
        const y = H - (s[k] / mx) * (H - 3) - 1.5;
        a += 'L' + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      }
      a += 'L' + W + ',' + H + ' Z';
      spark = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">`
        + `<path d="${a}" fill="rgba(82,230,223,0.13)"/>`
        + `<path d="${d}" fill="none" stroke="rgba(82,230,223,0.85)" stroke-width="1.5"/></svg>`;
    }
    return `<a class="card" href="${c.name}/index.html">`
      + `<div class="top"><span class="nm">Monde ${c.name}</span><span class="sd">graine ${c.seed}</span></div>`
      + `<div class="lin${c.extinct ? ' extinct' : ''}">${c.extinct ? 'monde eteint' : 'lignee ' + c.dominant}</div>`
      + spark
      + `<div class="row">`
      + `<span><b>${c.years}</b> ${c.years > 1 ? 'ans' : 'an'}</span>`
      + `<span><b>${fr(c.pop)}</b> vivants</span>`
      + `<span><b>${c.generations}</b> generations</span>`
      + `<span><b>${fr(c.agents_awoke)}</b> eveilles</span>`
      + `<span>diversite <b>${(c.diversity || 0).toFixed(3)}</b></span>`
      + `</div>`
      + `<div class="go">ouvrir ce monde &rarr;</div>`
      + `</a>`;
  }).join('');
}
</script>
</body>
</html>
